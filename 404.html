<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <title>Clip offline — Eben Owen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #F7F4EF; --ink: #1C1A17; --accent: #B85C2A; --accent-lt: #E8C5AE; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--ink); color: var(--bg);
      font-family: 'Barlow', sans-serif; padding: 2rem 16px;
      background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 4px);
    }
    .card { width: 100%; max-width: 640px; border: 1px solid rgba(247,244,239,0.14); padding: clamp(1.5rem, 5vw, 3rem); }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    .label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
    .tc { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 1.1rem; letter-spacing: 0.06em; color: var(--accent); font-variant-numeric: tabular-nums; }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; font-size: clamp(2.6rem, 9vw, 4.5rem); line-height: 0.95; margin: 1.5rem 0 1rem; }
    h1 em { font-style: normal; color: var(--accent); }
    p { color: rgba(247,244,239,0.6); line-height: 1.6; max-width: 42ch; }
    .bars { display: flex; height: 10px; margin: 2rem 0; }
    .bars span { flex: 1; }
    a.home { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bg); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 0.3rem; }
    a.home:hover { color: var(--accent-lt); }
  </style>
</head>
<body>
  <main class="card">
    <div class="row"><span class="label">Error 404 · Media offline</span><span class="tc" id="tc">00:00:04:04</span></div>
    <h1>This clip is<br><em>offline.</em></h1>
    <p>The page you're looking for has been moved, renamed or never made the final cut.</p>
    <div class="bars" aria-hidden="true">
      <span style="background:#C0C0C0"></span><span style="background:#C0C000"></span><span style="background:#00C0C0"></span><span style="background:#00C000"></span><span style="background:#C000C0"></span><span style="background:#C00000"></span><span style="background:#0000C0"></span>
    </div>
    <a class="home" href="/">Back to the sequence →</a>
  </main>
  <script>
    // a frame counter ticking like a stalled timecode
    (function () {
      const el = document.getElementById('tc');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let f = 0;
      setInterval(() => { f = (f + 1) % 25; el.textContent = '00:00:04:' + String(f).padStart(2, '0'); }, 40);
    })();
  </script>
  <script data-goatcounter="https://ebenowen.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
